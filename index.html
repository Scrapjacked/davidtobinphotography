<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noai, noimageai, noindex-image">
<title>David Tobin</title>

<style>
  :root{ --page:#ffffff; --ink:#1c1c1c; --ink-soft:#7a7a7a; --bevel:rgba(0,0,0,.07); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--page); color:var(--ink); }
  body{ font-family:"Helvetica Neue",Arial,system-ui,sans-serif; -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none; }

  header{ text-align:center; padding:72px 24px 26px; }
  header .name{ margin:0; font-weight:400; font-size:20px; letter-spacing:.34em; text-transform:uppercase; }

  /* loose scattered wall - varied sizes, uneven heights & spacing, no rows */
  .scatter{
    display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start;
    max-width:1280px; margin:0 auto; padding:10px 22px 60px;
    transition:opacity .5s ease; opacity:1;
  }
  .frame{
    margin-bottom:0; background:#fff; padding:9px; border-radius:1px;
    box-shadow:0 2px 4px rgba(0,0,0,.10), 0 14px 30px rgba(0,0,0,.18);
    cursor:pointer; transition:transform .25s ease, box-shadow .25s ease;
  }
  .frame:hover{ transform:translateY(-4px); box-shadow:0 4px 8px rgba(0,0,0,.12), 0 24px 50px rgba(0,0,0,.24); z-index:5; }
  .frame img{ display:block; width:auto; height:auto; border:1px solid var(--bevel); -webkit-user-drag:none; pointer-events:none; }
  @media (max-width:640px){
    .scatter{ padding:8px 12px 44px; }
    .frame{ padding:7px; }
  }

  footer{ max-width:640px; margin:16px auto 0; padding:44px 24px 76px; text-align:center; border-top:1px solid rgba(0,0,0,.08); }
  footer a{ color:var(--ink); text-decoration:none; border-bottom:1px solid rgba(0,0,0,.28); padding-bottom:1px; }
  footer a:hover{ border-bottom-color:var(--ink); }
  footer .line{ margin:0 0 16px; font-size:15px; }
  footer .line.small{ font-size:13px; color:var(--ink-soft); margin-top:22px; }
  footer .line.small a{ color:var(--ink-soft); border-bottom-color:rgba(0,0,0,.18); }

  .lightbox{ position:fixed; inset:0; background:rgba(20,20,20,.78); display:flex; align-items:center; justify-content:center; padding:5vmin; opacity:0; pointer-events:none; transition:opacity .28s ease; z-index:100; }
  .lightbox.open{ opacity:1; pointer-events:auto; }
  .lightbox .print{ background:#fff; padding:18px; border-radius:1px; box-shadow:0 6px 18px rgba(0,0,0,.10), 0 30px 70px rgba(0,0,0,.18); max-width:min(1100px,92vw); max-height:90vh; transform:scale(.97); transition:transform .28s ease; cursor:pointer; }
  .lightbox.open .print{ transform:scale(1); }
  .lightbox .print img{ display:block; max-width:100%; max-height:calc(90vh - 36px); width:auto; height:auto; border:1px solid var(--bevel); -webkit-user-drag:none; }
  .lightbox .close{ position:absolute; top:24px; right:28px; font-size:30px; line-height:1; color:rgba(255,255,255,.7); background:none; border:none; cursor:pointer; }
  .lightbox .close:hover{ color:#fff; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<!-- ==================================================================
     YOUR CONTROL PANEL
     ================================================================== -->
<script>
  // 1) YOUR DETAILS
  const SITE = {
    name:      "David Tobin",
    instagram: "david_tobin",   // just the handle - no "@"
    otherSite: "scrapjack.net"
  };

  // 2) WHERE THE PHOTOS LIVE
  //    TO ADD PHOTOS: drop image files into the "images" folder in your
  //    repo and commit. The site shows every image in that folder.
  const REPO = { owner:"Scrapjacked", name:"davidtobinphotography", folder:"images" };
</script>
<!-- ============ nothing below needs editing ============ -->


<header>
  <h1 class="name" id="siteName">David Tobin</h1>
</header>

<main class="scatter" id="scatter"></main>

<footer>
  <p class="line">Say hello on <a id="igLink" href="#" target="_blank" rel="noopener">Instagram</a></p>
  <p class="line small">powered by <a id="otherLink" href="#" target="_blank" rel="noopener">scrapjack.net</a></p>
</footer>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="close" id="closeBtn" aria-label="Close">&times;</button>
  <div class="print"><img id="lightboxImg" src="" alt="" draggable="false"></div>
</div>

<script>
  document.getElementById('siteName').textContent = SITE.name;
  const ig = document.getElementById('igLink');
  ig.href = "https://instagram.com/" + SITE.instagram;
  const other = document.getElementById('otherLink');
  other.href = "https://" + SITE.otherSite;
  other.textContent = SITE.otherSite;

  function placeholder(spec, i){
    const p = spec.split('x'); const w = +p[0], h = +p[1];
    const tones = ['#efedea','#e9e7e3','#eceae6','#e6e3de'];
    const fs = Math.round(Math.min(w,h)/9);
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='"+w+"' height='"+h+"'>"
      + "<rect width='100%' height='100%' fill='"+tones[i%tones.length]+"'/>"
      + "<rect x='0.5' y='0.5' width='"+(w-1)+"' height='"+(h-1)+"' fill='none' stroke='rgba(0,0,0,0.07)'/>"
      + "<text x='50%' y='50%' fill='rgba(0,0,0,0.26)' font-family='Helvetica,Arial,sans-serif' font-size='"+fs+"' letter-spacing='2' text-anchor='middle' dominant-baseline='middle'>photo</text>"
      + "</svg>";
    return "data:image/svg+xml," + encodeURIComponent(svg);
  }
  const PLACEHOLDERS = (function(){
    const out=[]; const ws=[560,600,620,640,660,680,700,720,760,800,820]; const hs=[540,560,600,620,640,700,740,760,780,800,820];
    for(let i=0;i<110;i++){ out.push(ws[i%ws.length] + "x" + hs[(i*7)%hs.length]); }
    return out;
  })();

  function shuffled(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  const sizes = ['size-s','size-m','size-l'];
  const scatter = document.getElementById('scatter');
  const lightbox = document.getElementById('lightbox');
  let ALL = [];
  let usingPlaceholders = false;

  function buildAll(){
    const small = window.innerWidth <= 640;
    const frag = document.createDocumentFragment();
    shuffled(ALL).forEach(function(entry, i){
      const fig = document.createElement('figure');
      fig.className = 'frame';
      fig.style.marginTop   = Math.floor(Math.random()*44) + 'px';
      fig.style.marginLeft  = (6 + Math.floor(Math.random()*24)) + 'px';
      fig.style.marginRight = (6 + Math.floor(Math.random()*24)) + 'px';
      const img = document.createElement('img');
      img.src = usingPlaceholders ? placeholder(entry, i) : entry;
      img.alt=''; img.draggable=false; img.loading='lazy';
      img.onload = function(){
        const portrait = img.naturalHeight >= img.naturalWidth;   // taller than wide
        const minH = small ? (portrait?112:90) : (portrait?170:124);
        const maxH = small ? (portrait?210:152) : (portrait?320:220);
        img.style.height = (minH + Math.floor(Math.random()*(maxH-minH))) + 'px';
      };
      fig.appendChild(img);
      frag.appendChild(fig);
    });
    scatter.appendChild(frag);
  }

  const api = "https://api.github.com/repos/" + REPO.owner + "/" + REPO.name + "/contents/" + REPO.folder;
  fetch(api, { headers:{ 'Accept':'application/vnd.github.v3+json' } })
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(data){
      const imgs = data
        .filter(function(f){ return f.type==='file' && /\.(jpe?g|png|gif|webp)$/i.test(f.name); })
        .map(function(f){ return f.download_url; });
      if(imgs.length){ ALL = imgs; usingPlaceholders = false; }
      else { ALL = PLACEHOLDERS; usingPlaceholders = true; }
      buildAll();
    })
    .catch(function(){ ALL = PLACEHOLDERS; usingPlaceholders = true; buildAll(); });

  // lightbox
  const lightImg = document.getElementById('lightboxImg');
  const closeBtn = document.getElementById('closeBtn');
  let viewSrcs = [], viewIndex = 0;
  function openAt(src){
    viewSrcs = Array.prototype.map.call(scatter.querySelectorAll('.frame img'), function(im){ return im.src; });
    viewIndex = viewSrcs.indexOf(src); if(viewIndex < 0) viewIndex = 0;
    lightImg.src = viewSrcs[viewIndex];
    lightbox.classList.add('open'); lightbox.setAttribute('aria-hidden','false');
  }
  function step(dir){
    if(!viewSrcs.length) return;
    viewIndex = (viewIndex + dir + viewSrcs.length) % viewSrcs.length;
    lightImg.src = viewSrcs[viewIndex];
  }
  function close(){ lightbox.classList.remove('open'); lightbox.setAttribute('aria-hidden','true'); }
  scatter.addEventListener('click', function(e){
    const fig = e.target.closest('.frame'); if(!fig) return;
    openAt(fig.querySelector('img').src);
  });
  lightbox.addEventListener('click', function(e){
    if(e.target === lightImg || e.target.closest('.print')){ step(1); } else { close(); }
  });
  closeBtn.addEventListener('click', function(e){ e.stopPropagation(); close(); });
  document.addEventListener('keydown', function(e){
    if(!lightbox.classList.contains('open')) return;
    if(e.key==='Escape') close();
    else if(e.key==='ArrowRight') step(1);
    else if(e.key==='ArrowLeft') step(-1);
  });

  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('dragstart', function(e){ e.preventDefault(); });
</script>

</body>
</html>
